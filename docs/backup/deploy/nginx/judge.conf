# Reverse proxy template for judge-server.
# Install: sudo cp deploy/nginx/judge.conf /etc/nginx/sites-available/judge
#          sudo ln -s ../sites-available/judge /etc/nginx/sites-enabled/
# Add TLS (certbot --nginx) after pointing DNS at this host.

upstream judge_api {
    server 127.0.0.1:8433;
}

server {
    listen 80;
    server_name judge.example.com;   # <- change

    client_max_body_size 52m;        # matches spring multipart limit

    # Health is the only actuator endpoint allowed from outside
    location = /actuator/health {
        proxy_pass http://judge_api;
    }
    location /actuator/ {
        return 404;
    }

    # WebSocket (STOMP/SockJS)
    location /ws/ {
        proxy_pass http://judge_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://judge_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
